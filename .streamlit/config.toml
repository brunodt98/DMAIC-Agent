# As mesmas cores de dmaic/ui/theme.py. O Streamlit pinta os componentes que
# ele controla por conta propria (menus, seletores, spinner) antes do CSS
# chegar, entao os dois precisam concordar.
[theme]
base                     = "dark"
primaryColor             = "#4D9FFF"
backgroundColor          = "#0B0E14"
secondaryBackgroundColor = "#131822"
textColor                = "#E7EAF0"
font                     = "sans serif"

[client]
toolbarMode = "minimal"
